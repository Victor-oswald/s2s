<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RunPod Speech-to-Speech Tester</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background: #0f1117;
      color: #e0e0e0;
    }
    .card {
      background: #181b23;
      border: 1px solid #2d3241;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    h2 { margin-top: 0; color: #4fffb0; font-size: 1.2rem; }
    label { display: block; margin: 10px 0 4px; font-weight: 600; font-size: 0.9rem; }
    input[type="text"], input[type="password"], select {
      width: 100%;
      padding: 10px;
      background: #0d0f14;
      border: 1px solid #2d3241;
      border-radius: 4px;
      color: #fff;
      box-sizing: border-box;
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button {
      background: #4fffb0;
      color: #0d0f14;
      font-weight: bold;
      border: none;
      padding: 12px 20px;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 12px;
    }
    button:disabled { background: #33394b; color: #777; cursor: not-allowed; }
    .recording { background: #ff4f4f !important; color: #fff; }
    #log {
      background: #08090c;
      font-family: monospace;
      padding: 12px;
      border-radius: 4px;
      height: 220px;
      overflow-y: auto;
      white-space: pre-wrap;
      color: #4fffb0;
      border: 1px solid #2d3241;
    }
  </style>
</head>
<body>

  <h1>RunPod Serverless Speech-to-Speech</h1>

  <!-- 1. Authentication & Endpoint Settings -->
  <div class="card">
    <h2>1. RunPod Configuration</h2>
    <div class="grid">
      <div>
        <label for="endpointId">Serverless Endpoint ID:</label>
        <input type="text" id="endpointId" value="2i6h109x5tco1x" required />
      </div>
      <div>
        <label for="apiKey">RunPod API Key:</label>
        <input type="password" id="apiKey" placeholder="rpa_..." required />
      </div>
    </div>
  </div>

  <!-- 2. Voice & Execution Controls -->
  <div class="card">
    <h2>2. Voice Pipeline Settings</h2>
    <div class="grid">
      <div>
        <label for="voiceProfile">Voice Profile ID:</label>
        <input type="text" id="voiceProfile" value="default_voice" />
      </div>
      <div>
        <label for="execMode">Execution Mode:</label>
        <select id="execMode">
          <option value="runsync">Sync (/runsync) - Low Latency</option>
          <option value="run">Async (/run) - Long Running</option>
        </select>
      </div>
    </div>

    <button id="recordBtn">Hold to Speak & Submit</button>
  </div>

  <!-- Output Log & Audio Player -->
  <div class="card">
    <h2>Output Logs & Playback</h2>
    <audio id="audioPlayer" controls style="width: 100%; margin-bottom: 12px;"></audio>
    <div id="log"></div>
  </div>

  <script>
    const logEl = document.getElementById('log');
    function log(msg) {
      logEl.innerText += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    let mediaRecorder = null;
    let audioChunks = [];
    const recordBtn = document.getElementById('recordBtn');
    const audioPlayer = document.getElementById('audioPlayer');

    // --- Audio Capture Handlers ---
    recordBtn.addEventListener('mousedown', startRecording);
    recordBtn.addEventListener('mouseup', stopAndSend);
    recordBtn.addEventListener('mouseleave', () => {
      if (mediaRecorder && mediaRecorder.state === 'recording') stopAndSend();
    });

    async function startRecording() {
      const apiKey = document.getElementById('apiKey').value.trim();
      if (!apiKey) {
        alert('Please enter your RunPod API Key.');
        return;
      }

      audioChunks = [];
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
        
        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.start();
        recordBtn.innerText = "Recording... Release to Send";
        recordBtn.classList.add('recording');
        log('Recording started...');
      } catch (err) {
        log(`Microphone Error: ${err.message}`);
      }
    }

    async function stopAndSend() {
      if (!mediaRecorder || mediaRecorder.state !== 'recording') return;

      recordBtn.innerText = "Processing...";
      recordBtn.classList.remove('recording');
      recordBtn.disabled = true;

      mediaRecorder.stop();
      mediaRecorder.onstop = async () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const base64Audio = await blobToBase64(audioBlob);
        
        // Stop stream tracks
        mediaRecorder.stream.getTracks().forEach(track => track.stop());

        await submitToRunPod(base64Audio);
        recordBtn.innerText = "Hold to Speak & Submit";
        recordBtn.disabled = false;
      };
    }

    // Convert Blob to Base64 (stripping Data URL prefix)
    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => {
          const base64 = reader.result.split(',')[1];
          resolve(base64);
        };
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    // --- RunPod Serverless API Request ---
    async function submitToRunPod(base64Audio) {
      const endpointId = document.getElementById('endpointId').value.trim();
      const apiKey = document.getElementById('apiKey').value.trim();
      const voiceId = document.getElementById('voiceProfile').value.trim();
      const mode = document.getElementById('execMode').value;

      const url = `https://api.runpod.ai/v2/${endpointId}/${mode}`;

      const payload = {
        input: {
          audio_base64: base64Audio,
          voice_id: voiceId,
          audio_format: "webm"
        }
      };

      log(`Submitting payload to RunPod Serverless (${mode})...`);

      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!res.ok) {
          log(`RunPod Error (${res.status}): ${JSON.stringify(data)}`);
          return;
        }

        if (mode === 'runsync') {
          handleJobOutput(data);
        } else {
          log(`Job queued with ID: ${data.id}. Polling status...`);
          pollJobStatus(endpointId, apiKey, data.id);
        }
      } catch (err) {
        log(`Network Request Failed: ${err.message}`);
      }
    }

    // Poll status for async /run jobs
    async function pollJobStatus(endpointId, apiKey, jobId) {
      const statusUrl = `https://api.runpod.ai/v2/${endpointId}/status/${jobId}`;
      
      const interval = setInterval(async () => {
        try {
          const res = await fetch(statusUrl, {
            headers: { 'Authorization': `Bearer ${apiKey}` }
          });
          const data = await res.json();
          log(`Job Status: ${data.status}`);

          if (data.status === 'COMPLETED') {
            clearInterval(interval);
            handleJobOutput(data);
          } else if (data.status === 'FAILED') {
            clearInterval(interval);
            log(`Job Failed: ${JSON.stringify(data.error)}`);
          }
        } catch (e) {
          clearInterval(interval);
          log(`Polling Error: ${e.message}`);
        }
      }, 1000);
    }

    // Render output audio and transcription metadata
    function handleJobOutput(responseData) {
      const output = responseData.output;
      if (!output) {
        log(`No output returned: ${JSON.stringify(responseData)}`);
        return;
      }

      if (output.transcript) {
        log(`Transcript: "${output.transcript}"`);
      }

      if (output.audio_base64) {
        log('Received generated audio payload. Playing back...');
        const audioSrc = `data:audio/wav;base64,${output.audio_base64}`;
        audioPlayer.src = audioSrc;
        audioPlayer.play();
      } else if (output.audio_url) {
        log(`Playing audio from output URL: ${output.audio_url}`);
        audioPlayer.src = output.audio_url;
        audioPlayer.play();
      }
    }
  </script>
</body>
</html>
